<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Outer Kamon / Hanko Medallion -->
  <circle cx="128" cy="128" r="120" fill="#2B2A2A" stroke="#5a5a5a" stroke-width="4"/>
  <circle cx="128" cy="128" r="110" stroke="#dcbd93" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Subtle Seigaiha / Enso background ring -->
  <path d="M52 128 A76 76 0 1 1 204 128" stroke="#353434" stroke-width="14" stroke-linecap="round"/>
  <path d="M204 128 A76 76 0 0 1 52 128" stroke="#3b3a3a" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 10"/>

  <!-- Wada Paired Color Swatch Ribbons (Behind the H pillars) -->
  <!-- Pair 1: String / Definition (Sage & Soft Teal-Slate) -->
  <rect x="44" y="96" width="168" height="12" rx="3" fill="#a8bcac"/>
  <rect x="128" y="96" width="84" height="12" rx="3" fill="#a8b0b8"/>

  <!-- Pair 2: Keyword / Control (Wisteria & Muted Lavender) -->
  <rect x="52" y="148" width="152" height="10" rx="3" fill="#b3a6b0"/>
  <rect x="128" y="148" width="76" height="10" rx="3" fill="#9e8f9c"/>

  <!-- Stylized Japanese Torii / Brushstroke "H" -->
  <!-- Left Pillar (Type / Builtin pair: Celadon & Slate Blue) -->
  <path d="M68 50 L96 46 L96 210 L68 206 Z" fill="#93a5a0" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M84 48 L96 46 L96 210 L84 208 Z" fill="#859099"/>
  <path d="M68 50 L96 46 L96 210 L68 206 Z" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>

  <!-- Right Pillar (Function / Library pair: Warm Gold & Soft Gold) -->
  <path d="M160 46 L188 50 L188 206 L160 210 Z" fill="#dcbd93" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M174 48 L188 50 L188 206 L174 208 Z" fill="#cebfa1"/>
  <path d="M160 46 L188 50 L188 206 L160 210 Z" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>

  <!-- Central Sweeping Crossbar of the "H" (Kasagi-inspired arch in Bone & Rose/Terracotta) -->
  <path d="M40 116 Q128 130 216 116 L210 140 Q128 152 46 140 Z" fill="#cca598" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M44 128 Q128 141 212 128 L210 140 Q128 152 46 140 Z" fill="#cc9a98"/>
  <path d="M40 116 Q128 130 216 116 L210 140 Q128 152 46 140 Z" stroke="#2B2A2A" stroke-width="5" stroke-linejoin="round"/>

  <!-- Center Joinery Pin (Kusabi) in Bone -->
  <rect x="120" y="114" width="16" height="32" rx="3" fill="#e8e8d3" stroke="#2B2A2A" stroke-width="4"/>

  <!-- Pillar Caps & Footings -->
  <rect x="63" y="58" width="38" height="8" rx="2" fill="#e8e8d3" stroke="#2B2A2A" stroke-width="3"/>
  <rect x="155" y="58" width="38" height="8" rx="2" fill="#e8e8d3" stroke="#2B2A2A" stroke-width="3"/>
  <rect x="63" y="190" width="38" height="8" rx="2" fill="#d7d7c6" stroke="#2B2A2A" stroke-width="3"/>
  <rect x="155" y="190" width="38" height="8" rx="2" fill="#d7d7c6" stroke="#2B2A2A" stroke-width="3"/>

  <!-- Hanko Stamp Accent (Bottom Center) -->
  <rect x="114" y="176" width="28" height="28" rx="4" fill="#cc9a98" stroke="#2B2A2A" stroke-width="3"/>
  <path d="M121 183 V197 M135 183 V197 M121 190 H135" stroke="#e8e8d3" stroke-width="2.5" stroke-linecap="round"/>
</svg>
